name: Uptime probe

on:
  schedule:
    - cron: "41 4 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-commit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe base URLs and hosted MCP endpoints
        run: python scripts/probe_uptime.py
      - name: Rebuild
        run: python scripts/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Daily uptime probe $(date -u +%F)"
          git pull --rebase
          git push
