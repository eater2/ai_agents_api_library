name: Check catalog

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generated files are up to date
        if: github.event_name == 'pull_request'
        run: |
          python scripts/build.py
          git diff --exit-code -- . ':!data/link-status.json' || (echo "Run python scripts/build.py and commit the result." && exit 1)

      - name: Check links
        id: links
        continue-on-error: true
        run: python scripts/check_links.py

      - name: Rebuild with fresh link status
        run: python scripts/build.py

      - name: Commit link status
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly link check $(date -u +%F)"
          git push

      - name: Fail on broken docs links
        if: steps.links.outcome == 'failure'
        run: exit 1
